# Meridian Bank "CDN": an nginx caching proxy in front of MinIO (SANDBOX).
#
# Real behaviour the scenarios depend on (SPEC 4.2):
#   * Objects fetched while a bucket is public are cached for 30 days.
#   * After the origin bucket is made private, the cached copy KEEPS being served until purged.
#   * Authenticated / presigned requests bypass the cache (never cached, never served from cache).
worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 1024; }

http {
  resolver 127.0.0.11 valid=10s ipv6=off;

  log_format mallya_json escape=json
    '{"ts":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
    '"uri":"$uri","args":"$args","status":$status,"body_bytes_sent":$body_bytes_sent,'
    '"cache":"$upstream_cache_status","ua":"$http_user_agent","probe":"$http_x_mallya_probe",'
    '"request_id":"$request_id","server_port":"$server_port","upstream_status":"$upstream_status",'
    '"authenticated":"$authn"}';

  proxy_cache_path /var/cache/nginx/cdn levels=1:2 keys_zone=cdn:10m max_size=1g inactive=30d use_temp_path=off;

  # A request is "authenticated" if it carries SigV4 credentials (header or presigned query).
  map $http_authorization $authn_header { ""  "0"; default "1"; }
  map $args $authn_query { default "0"; "~*X-Amz-Signature=" "1"; }
  map "$authn_header$authn_query" $authn { "00" "0"; default "1"; }

  server {
    listen 8080;
    server_name cdn.meridian.sandbox;
    access_log /var/log/mallya/access.json mallya_json;
    client_max_body_size 1m;

    location / {
      # The CDN edge is read-only.
      limit_except GET HEAD { deny all; }
      set $origin http://minio:9000;
      proxy_pass $origin;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_http_version 1.1;

      proxy_cache cdn;
      proxy_cache_key "$request_method:$uri";
      proxy_cache_convert_head off;
      proxy_cache_methods GET HEAD;
      proxy_cache_valid 200 30d;
      proxy_cache_bypass $authn $args;
      # MALLYA's own probes/inspections may READ the cache but never populate it,
      # so verification cannot create the residual exposure it is looking for.
      proxy_no_cache $authn $args $http_x_mallya_probe $http_x_mallya_inspect;
      proxy_ignore_headers Cache-Control Expires Set-Cookie Vary X-Accel-Expires;
      proxy_cache_lock on;
      add_header X-Cache-Status $upstream_cache_status always;
    }
  }

  # Probe gateway: lets the control plane (customer_net) hand jobs to the external probes.
  # Only customer_net hosts may use it; the docker gateway (.1) is excluded.
  server {
    listen 9100;
    access_log off;
    deny 172.28.0.1;
    allow 172.28.0.0/24;
    deny all;

    location /verifier/ {
      set $verifier verifier;
      rewrite ^/verifier/(.*)$ /$1 break;
      proxy_pass http://$verifier:7000;
      proxy_read_timeout 180s;
    }
    location /attacker/ {
      set $attacker attacker;
      rewrite ^/attacker/(.*)$ /$1 break;
      proxy_pass http://$attacker:7000;
      proxy_read_timeout 180s;
    }
  }
}
